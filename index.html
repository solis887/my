<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>符文小精灵 · 3D 收集小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    display: flex; gap: 12px;
    pointer-events: none; user-select: none;
  }
  .hudItem {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 8px;
    background: rgba(255,255,255,.62);
    border: 3px solid rgba(255,255,255,.92);
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,80,120,.2);
    backdrop-filter: blur(8px);
  }
  .hudIcon {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: inset 0 0 8px rgba(255,255,255,.5);
  }
  .hudIcon.score { background: linear-gradient(180deg, #aee2ff, #4aa8f0); }
  .hudIcon.lives { background: linear-gradient(180deg, #ffc8d4, #ff5a7a); }
  .hudIcon.level { background: linear-gradient(180deg, #ffe3a8, #ff9f1c); }

  .hudText { display: flex; flex-direction: column; gap: 1px; }
  .hudLabel {
    font-size: 10px; font-weight: 800; letter-spacing: 1.2px;
    color: #7fa9bd; text-transform: uppercase;
  }
  .hudValue {
    font-size: 22px; font-weight: 900; color: #0a5d7a;
    line-height: 1; letter-spacing: 1px;
  }
  #scoreVal { color: #1e88ff; }
  #livesVal { color: #ff5a7a; letter-spacing: 2px; font-size: 18px; }
  #levelVal { color: #ff9f1c; }

  #skills {
    position: fixed; left: 18px; bottom: 22px; z-index: 10;
    display: flex; gap: 14px;
    pointer-events: none; user-select: none;
  }
  .skill {
    width: 72px; height: 72px; border-radius: 20px;
    background: rgba(255,255,255,.62);
    border: 3px solid rgba(255,255,255,.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,80,120,.2);
    backdrop-filter: blur(8px);
    position: relative; overflow: hidden;
    transition: transform .2s;
  }
  .skill.ready { animation: skillPulse 1.6s ease-in-out infinite; }
  @keyframes skillPulse {
    0%, 100% { box-shadow: 0 8px 20px rgba(0,80,120,.2); }
    50% { box-shadow: 0 8px 28px rgba(30,136,255,.6),
                      0 0 0 3px rgba(30,136,255,.2); }
  }
  .skill .key {
    position: absolute; top: 3px; right: 6px;
    font-size: 9px; font-weight: 900; color: #4f92b8;
    letter-spacing: .5px;
  }
  .skill .icon { font-size: 30px; line-height: 1; }
  .skill .name {
    font-size: 9px; font-weight: 800; color: #0a5d7a;
    letter-spacing: .5px; margin-top: 2px;
  }
  .skill .cd {
    position: absolute; left: 0; bottom: 0; width: 100%;
    background: rgba(30,136,255,.45);
    height: 0%; transition: height .08s linear;
  }
  .skill.dash  { border-color: #bde9ff; }
  .skill.dodge { border-color: #ffe3c8; }

  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 10; padding: 9px 22px;
    background: rgba(255,255,255,.55);
    border-radius: 999px;
    color: #0a5d7a; font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 16px rgba(0,80,120,.15);
    white-space: nowrap; backdrop-filter: blur(8px);
    pointer-events: none; user-select: none;
  }

  #flash {
    position: fixed; inset: 0; z-index: 15; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at center,
      rgba(255,80,120,0) 35%, rgba(255,60,100,.6) 100%);
  }
  #flash.hit { animation: flashAnim .45s ease-out; }
  @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

  #levelToast {
    position: fixed; top: 44%; left: 50%;
    transform: translate(-50%, -50%) scale(.6);
    z-index: 18; opacity: 0; pointer-events: none;
    font-size: 64px; font-weight: 900; letter-spacing: 6px;
    color: #ffffff; text-align: center;
    text-shadow: 0 6px 0 #1e88ff, 0 12px 30px rgba(0,80,140,.4);
  }
  #levelToast.show { animation: toastAnim 1.7s ease-out; }
  @keyframes toastAnim {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    75%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.15); }
  }
  #levelToast .sub2 {
    display: block; font-size: 22px; letter-spacing: 4px;
    margin-top: 10px; opacity: .9;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20,60,100,.5);
    backdrop-filter: blur(8px);
    transition: opacity .3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .card {
    padding: 36px 52px 32px; background: #fff;
    border: 5px solid #bde9ff;
    border-radius: 32px; text-align: center;
    box-shadow: 0 30px 70px rgba(0,60,120,.35);
    animation: cardPop .35s cubic-bezier(.2,1.3,.4,1);
    min-width: 360px;
  }
  @keyframes cardPop {
    0% { transform: scale(.8) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .card h1 {
    font-size: 30px; color: #0a5d7a;
    margin-bottom: 4px; letter-spacing: 3px;
  }
  .card .sub {
    font-size: 12px; color: #7fa9bd;
    margin-bottom: 20px; letter-spacing: 3px; font-weight: 700;
  }

  .scoreShow {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 22px;
  }
  .scoreShow .bigNum {
    font-size: 68px; font-weight: 900; color: #1e88ff;
    line-height: 1; letter-spacing: 2px;
    text-shadow: 0 4px 0 rgba(30,136,255,.15);
  }
  .scoreShow .unit {
    font-size: 20px; color: #7fa9bd; font-weight: 800;
    padding-top: 20px;
  }

  .envPreview {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-radius: 18px;
    background: linear-gradient(135deg, #f0f9ff, #e0f2ff);
    border: 2px solid #bde9ff;
    margin-bottom: 20px;
    text-align: left;
  }
  .envIcon {
    width: 50px; height: 50px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: #fff;
    box-shadow: 0 4px 12px rgba(30,136,255,.15);
    flex-shrink: 0;
  }
  .envText { flex: 1; }
  .envText .label {
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    color: #7fa9bd; margin-bottom: 2px;
  }
  .envText .name {
    font-size: 17px; font-weight: 900; color: #0a5d7a;
    letter-spacing: 1px;
  }

  .levelProgress { margin-bottom: 22px; }
  .levelProgress .info {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 800; color: #4f92b8;
    margin-bottom: 6px; letter-spacing: .5px;
  }
  .levelProgress .bar {
    height: 10px; border-radius: 999px;
    background: #e8f4fc; overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,60,120,.1);
  }
  .levelProgress .bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #59c9ff, #1e88ff);
    border-radius: 999px;
    transition: width .4s ease;
  }

  .btnRow {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 4px;
  }
  .btn {
    padding: 14px 32px; font-size: 16px; font-weight: 800;
    letter-spacing: 2px; color: #fff; border: none;
    border-radius: 999px; cursor: pointer; font-family: inherit;
    background: linear-gradient(180deg, #59c9ff, #1e88ff);
    box-shadow: 0 7px 0 #1567c4, 0 12px 22px rgba(30,136,255,.35);
    transition: transform .1s ease, box-shadow .1s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { transform: translateY(-3px);
    box-shadow: 0 10px 0 #1567c4, 0 16px 28px rgba(30,136,255,.4); }
  .btn:active { transform: translateY(3px);
    box-shadow: 0 3px 0 #1567c4, 0 6px 14px rgba(30,136,255,.3); }
  .btn.gray {
    background: linear-gradient(180deg, #cfd8de, #9aa9b4);
    box-shadow: 0 7px 0 #6f7d88, 0 12px 22px rgba(120,140,160,.3);
  }
  .btn.gray:hover { box-shadow: 0 10px 0 #6f7d88, 0 16px 28px rgba(120,140,160,.35); }
  .btn.gray:active { box-shadow: 0 3px 0 #6f7d88; }
  .btn .ico { font-size: 18px; }

  #home {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: linear-gradient(180deg, #aee8ff 0%, #7ecbff 45%, #4aa8f0 100%);
    transition: opacity .5s ease, visibility .5s;
  }
  #home.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .cloud {
    position: absolute; background: rgba(255,255,255,.85);
    border-radius: 999px; filter: blur(.5px);
    box-shadow: 0 10px 30px rgba(120,190,240,.4);
    animation: floatCloud linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 130%; left: 8%;  top: -60%; }
  .cloud::after  { width: 45%; height: 110%; right: 10%; top: -45%; }
  @keyframes floatCloud {
    from { transform: translateX(-30vw); }
    to   { transform: translateX(130vw); }
  }

  .homeBox {
    position: relative; z-index: 2;
    padding: 48px 72px 42px;
    background: rgba(255,255,255,.78);
    border: 6px solid rgba(255,255,255,.96);
    border-radius: 40px;
    text-align: center;
    box-shadow: 0 30px 70px rgba(20,90,150,.4),
                inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(12px);
    animation: homePop .6s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes homePop {
    0%   { transform: translateY(24px) scale(.9); opacity: 0; }
    100% { transform: translateY(0) scale(1);     opacity: 1; }
  }

  .homeTitle {
    font-size: 52px; font-weight: 900; letter-spacing: 8px;
    color: #0a5d7a; margin-bottom: 4px;
    text-shadow: 0 4px 0 #bde9ff, 0 8px 20px rgba(30,136,255,.2);
  }
  .homeSub {
    font-size: 13px; color: #4f92b8; letter-spacing: 6px;
    margin-bottom: 24px; font-weight: 800;
  }

  .hero {
    width: 120px; height: 120px; margin: 0 auto 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #8afff3, #3fd0c9 55%, #1fa9a2);
    box-shadow: 0 16px 40px rgba(30,150,150,.5),
                inset -8px -10px 20px rgba(0,60,80,.25),
                inset 6px 8px 16px rgba(255,255,255,.4);
    position: relative;
    animation: heroBob 2.4s ease-in-out infinite;
  }
  .hero::before, .hero::after {
    content: ''; position: absolute; width: 16px; height: 20px;
    background: #18324a; border-radius: 50%;
    top: 46px;
  }
  .hero::before { left: 28px; }
  .hero::after  { right: 28px; }
  .heroHorn {
    position: absolute; left: 50%; top: -20px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 24px solid #ffd166;
    filter: drop-shadow(0 4px 8px rgba(255,180,60,.5));
  }
  @keyframes heroBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .rules {
    display: flex; gap: 22px; justify-content: center;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .rule {
    font-size: 12px; color: #0a5d7a; font-weight: 700;
    line-height: 1.6; min-width: 110px;
  }
  .rule b { display: block; font-size: 24px; margin-bottom: 2px; }

  #startBtn {
    padding: 16px 68px; font-size: 22px; font-weight: 900;
    letter-spacing: 4px;
  }
</style>
</head>
<body>

<!-- ================= 主页 ================= -->
<div id="home">
  <div class="cloud" style="width:150px;height:52px;top:12%;animation-duration:38s;"></div>
  <div class="cloud" style="width:220px;height:70px;top:28%;animation-duration:52s;animation-delay:-12s;opacity:.75;"></div>
  <div class="cloud" style="width:120px;height:44px;top:62%;animation-duration:44s;animation-delay:-26s;opacity:.65;"></div>
  <div class="cloud" style="width:180px;height:58px;top:78%;animation-duration:60s;animation-delay:-8s;opacity:.8;"></div>

  <div class="homeBox">
    <div class="hero"><div class="heroHorn"></div></div>
    <div class="homeTitle">符文小精灵</div>
    <div class="homeSub">RUNE SPRITE</div>
    <div class="rules">
      <div class="rule"><b>🎮</b>WASD / 方向键</div>
      <div class="rule"><b>💎</b>点亮水晶</div>
      <div class="rule"><b>👻</b>躲开幽灵</div>
      <div class="rule"><b>⚡</b>Shift 冲刺</div>
      <div class="rule"><b>💫</b>E 闪避</div>
    </div>
    <button id="startBtn" class="btn"><span class="ico">▶</span>开始游戏</button>
  </div>
</div>

<!-- ================= HUD ================= -->
<div id="hud" style="display:none;">
  <div class="hudItem">
    <div class="hudIcon score">💎</div>
    <div class="hudText">
      <div class="hudLabel">SCORE</div>
      <div class="hudValue" id="scoreVal">0</div>
    </div>
  </div>
  <div class="hudItem">
    <div class="hudIcon lives">❤</div>
    <div class="hudText">
      <div class="hudLabel">LIVES</div>
      <div class="hudValue" id="livesVal">❤❤❤</div>
    </div>
  </div>
  <div class="hudItem">
    <div class="hudIcon level">🏆</div>
    <div class="hudText">
      <div class="hudLabel">LEVEL</div>
      <div class="hudValue" id="levelVal">1</div>
    </div>
  </div>
</div>

<div id="skills" style="display:none;">
  <div class="skill dash" id="skillDash">
    <div class="key">SHIFT</div>
    <div class="icon">⚡</div>
    <div class="name">DASH</div>
    <div class="cd" id="dashCd"></div>
  </div>
  <div class="skill dodge" id="skillDodge">
    <div class="key">E</div>
    <div class="icon">💫</div>
    <div class="name">DODGE</div>
    <div class="cd" id="dodgeCd"></div>
  </div>
</div>

<div id="hint" style="display:none;">WASD 移动 · Shift 冲刺 · E 闪避 · 靠近水晶得分 · 躲开幽灵</div>
<div id="flash"></div>
<div id="levelToast"></div>

<div id="levelClear" class="overlay hidden">
  <div class="card">
    <h1>✨ 本关完成 ✨</h1>
    <p class="sub">LEVEL CLEAR</p>
    <div class="scoreShow">
      <div class="bigNum" id="clearScore">0</div>
      <div class="unit">分</div>
    </div>
    <div class="levelProgress">
      <div class="info">
        <span>关卡进度</span>
        <span>第 <span id="clearLevel">1</span> 关</span>
      </div>
      <div class="bar"><div class="fill" id="levelProgressFill" style="width:0%"></div></div>
    </div>
    <div class="envPreview">
      <div class="envIcon" id="nextEnvIcon">🌅</div>
      <div class="envText">
        <div class="label">NEXT STAGE</div>
        <div class="name" id="nextEnvTip">黄昏沙漠</div>
      </div>
    </div>
    <div class="btnRow">
      <button id="stayBtn" class="btn gray"><span class="ico">⟲</span>再玩一次</button>
      <button id="nextBtn" class="btn"><span class="ico">→</span>进入下一关</button>
    </div>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="card">
    <h1>🏁 游戏结束</h1>
    <p class="sub">GAME OVER</p>
    <div class="scoreShow">
      <div class="bigNum" id="finalScore">0</div>
      <div class="unit">分</div>
    </div>
    <div class="levelProgress">
      <div class="info">
        <span>到达关卡</span>
        <span>第 <span id="finalLevel">1</span> 关</span>
      </div>
      <div class="bar"><div class="fill" style="width:100%"></div></div>
    </div>
    <div class="btnRow">
      <button id="backHomeBtn" class="btn gray"><span class="ico">🏠</span>回主页</button>
      <button id="restartBtn" class="btn"><span class="ico">⟲</span>再来一次</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

<script>
if (typeof THREE === 'undefined') {
  document.body.innerHTML =
    '<div style="padding:40px;font:16px sans-serif;color:#c00">' +
    '❌ three.js 加载失败，请检查网络后刷新页面。</div>';
  throw new Error('three.js 未加载');
}

   ① 全局参数
   ========================================================= */

var LIMIT = CONFIG.mapSize / 2 - 1.2;

/* =========================================================
   ② 环境主题
   ========================================================= */
var THEMES = [
  {

    hemiSky:0xe8f6ff, hemiGround:0x5a7c4a, hemiInt:1.0,
    sunColor:0xfff4d6, sunInt:1.45, sunPos:[20,34,16],
    fillColor:0xb8d9ff, fillInt:0.35, fillPos:[-15,12,-10],
    cloud:true,
    trunk:0x8b6b4a, leaf1:0x4f9e5f, leaf2:0x3d8a52, rock:0xb8c8be,
    treeRatio:0.6, stars:false,

    groundDecor: { type:'pebble', color:0xb88a4a, count:80, size:0.2, spread:0.7 },

  },
  {

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

function lerpAngle(a, b, t) {
  var d = (b - a) % (Math.PI * 2);
  if (d >  Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function randomPos(minDist, others) {
  for (var i = 0; i < 80; i++) {
    var x = (Math.random() * 2 - 1) * HALF;
    var z = (Math.random() * 2 - 1) * HALF;
    var ok = true;
    for (var j = 0; j < others.length; j++) {
      var p = others[j];
      if (Math.hypot(p.x - x, p.z - z) < minDist) { ok = false; break; }
    }
    if (ok) return new THREE.Vector3(x, 0, z);
  }
  return new THREE.Vector3(
    (Math.random() * 2 - 1) * HALF, 0,
    (Math.random() * 2 - 1) * HALF
  );
}

function makeSkyGradient(topHex, bottomHex) {
  var canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 512;
  var ctx = canvas.getContext('2d');
  var g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, '#' + ('000000' + topHex.toString(16)).slice(-6));
  g.addColorStop(1, '#' + ('000000' + bottomHex.toString(16)).slice(-6));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  var tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

function makeGroundTexture(mainHex, darkHex) {
  var size = 256;
  var canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  var ctx = canvas.getContext('2d');

  ctx.fillStyle = '#' + ('000000' + mainHex.toString(16)).slice(-6);
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = '#' + ('000000' + darkHex.toString(16)).slice(-6);
  for (var i = 0; i < 260; i++) {
    var x = Math.random() * size;
    var y = Math.random() * size;
    var r = 1 + Math.random() * 5;
    ctx.globalAlpha = 0.15 + Math.random() * 0.35;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  for (var j = 0; j < 120; j++) {
    ctx.globalAlpha = 0.05 + Math.random() * 0.12;
    var xx = Math.random() * size;
    var yy = Math.random() * size;
    var rr = 0.5 + Math.random() * 1.5;
    ctx.beginPath();
    ctx.arc(xx, yy, rr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  var tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.anisotropy = 4;
  return tex;
}

var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  return audioCtx;
}

function playTone(freq, dur, type, vol) {
  var ctx = ensureAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur);
}

function buildGroundDecor(theme) {
  while (groundDecorGroup.children.length) {
    groundDecorGroup.remove(groundDecorGroup.children[0]);
  }
  var cfg = theme.groundDecor;
  if (!cfg) return;

  var geo;
  if (cfg.type === 'pebble') geo = new THREE.DodecahedronGeometry(cfg.size, 0);
  else if (cfg.type === 'star') geo = new THREE.TetrahedronGeometry(cfg.size, 0);
  else geo = new THREE.OctahedronGeometry(cfg.size, 0);

  var mat = new THREE.MeshStandardMaterial({
    color: cfg.color, flatShading: true, roughness: 0.9
  });

  var mesh = new THREE.InstancedMesh(geo, mat, cfg.count);
  var dummy = new THREE.Object3D();

  for (var i = 0; i < cfg.count; i++) {
    var x = (Math.random() * 2 - 1) * HALF;
    var z = (Math.random() * 2 - 1) * HALF;
    if (Math.hypot(x, z) < 3) {
      x = (x > 0 ? 1 : -1) * (3 + Math.random() * HALF);
      z = (z > 0 ? 1 : -1) * (3 + Math.random() * HALF);
      x = clamp(x, -HALF, HALF);
      z = clamp(z, -HALF, HALF);
    }
    dummy.position.set(x, cfg.size * 0.5, z);
    dummy.rotation.set(
      Math.random() * 0.3,
      Math.random() * Math.PI * 2,
      Math.random() * 0.3
    );
    dummy.scale.setScalar(cfg.spread * (0.6 + Math.random() * 0.8));
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  groundDecorGroup.add(mesh);
}

function buildParticles(theme) {
  while (particleGroup.children.length) {
    particleGroup.remove(particleGroup.children[0]);
  }
  particleData = null;
  var cfg = theme.particle;
  if (!cfg) return;

  var count = cfg.count;
  var positions = new Float32Array(count * 3);
  for (var i = 0; i < count; i++) {
    positions[i * 3]     = (Math.random() * 2 - 1) * HALF;
    positions[i * 3 + 1] = Math.random() * 8 + 0.5;
    positions[i * 3 + 2] = (Math.random() * 2 - 1) * HALF;
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  var mat = new THREE.PointsMaterial({
    color: cfg.color, size: cfg.size, sizeAttenuation: true,
    transparent: true, opacity: 0.85, depthWrite: false,
    blending: cfg.type === 'firefly' ? THREE.AdditiveBlending : THREE.NormalBlending
  });

  var points = new THREE.Points(geo, mat);
  particleGroup.add(points);
  particleData = { points: points, positions: positions, cfg: cfg, count: count };
}

function updateParticles(dt) {
  if (!particleData) return;
  var cfg = particleData.cfg;
  var arr = particleData.positions;
  var count = particleData.count;
  for (var i = 0; i < count; i++) {
    var idx = i * 3;
    if (cfg.type === 'sand') {
      arr[idx]     += dt * cfg.speed;
      arr[idx + 1] += Math.sin(state.time * 2 + i) * dt * 0.3;
      if (arr[idx] > HALF) arr[idx] = -HALF;
    } else if (cfg.type === 'snow') {
      arr[idx]     += Math.sin(state.time * 1.2 + i) * dt * 0.3;
      arr[idx + 1] -= dt * cfg.speed;
      if (arr[idx + 1] < 0.2) arr[idx + 1] = 8 + Math.random() * 3;
    } else if (cfg.type === 'firefly') {
      arr[idx]     += Math.sin(state.time * 1.5 + i * 0.7) * dt * cfg.speed;
      arr[idx + 1] += Math.cos(state.time * 1.2 + i * 0.9) * dt * cfg.speed * 0.6;
      arr[idx + 2] += Math.sin(state.time * 1.1 + i * 1.3) * dt * cfg.speed * 0.5;
    } else {
      arr[idx]     += Math.sin(state.time * 0.5 + i) * dt * 0.15;
      arr[idx + 1] += dt * cfg.speed * 0.3;
      if (arr[idx + 1] > 9) arr[idx + 1] = 0.5;
    }
  }
  particleData.points.geometry.attributes.position.needsUpdate = true;
}

var decorGroup = new THREE.Group();
scene.add(decorGroup);
var decorColliders = [];

function buildDecor(theme) {
  while (decorGroup.children.length) decorGroup.remove(decorGroup.children[0]);
  decorColliders.length = 0;

  var trunkMat = new THREE.MeshStandardMaterial({ color: theme.trunk, flatShading: true, roughness: 1 });
  var leaf1Mat = new THREE.MeshStandardMaterial({ color: theme.leaf1, flatShading: true, roughness: 1 });
  var leaf2Mat = new THREE.MeshStandardMaterial({ color: theme.leaf2, flatShading: true, roughness: 1 });
  var rockMat  = new THREE.MeshStandardMaterial({ color: theme.rock,  flatShading: true, roughness: 1 });

  var placed = [];

  for (var i = 0; i < 30; i++) {
    var pos = null;
    for (var attempt = 0; attempt < 60; attempt++) {
      var angle = Math.random() * Math.PI * 2;
      var radius = HALF * (0.68 + Math.random() * 0.3);
      var x = Math.cos(angle) * radius;
      var z = Math.sin(angle) * radius;

      if (Math.hypot(x, z) < 5.5) continue;
      var ok = true;
      for (var k = 0; k < placed.length; k++) {
        if (Math.hypot(placed[k].x - x, placed[k].z - z) < 3.0) {
          ok = false; break;
        }
      }
      if (!ok) continue;
      pos = { x: x, z: z };
      break;
    }
    if (!pos) continue;
    placed.push(pos);

    if (Math.random() < theme.treeRatio) {
      var tree = new THREE.Group();
      var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 1.0, 6), trunkMat);
      trunk.position.y = 0.5; trunk.castShadow = true;
      tree.add(trunk);

      var bottom = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.3, 7), leaf2Mat);
      bottom.position.y = 1.4; bottom.castShadow = true;
      tree.add(bottom);

      var middle = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.1, 7), leaf1Mat);
      middle.position.y = 2.0; middle.castShadow = true;
      tree.add(middle);

      var top = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.9, 7), leaf2Mat);
      top.position.y = 2.55; top.castShadow = true;
      tree.add(top);

      tree.position.set(pos.x, 0, pos.z);
      tree.rotation.y = Math.random() * Math.PI * 2;
      var scl = 0.8 + Math.random() * 0.5;
      tree.scale.setScalar(scl);
      decorGroup.add(tree);

      decorColliders.push({ x: pos.x, z: pos.z, r: CONFIG.treeCollideR * scl });
    } else {
      var rockSize = 0.35 + Math.random() * 0.45;
      var rockGeo = new THREE.DodecahedronGeometry(rockSize, 0);
      var posAttr = rockGeo.attributes.position;
      for (var p = 0; p < posAttr.count; p++) {
        var ox = posAttr.getX(p);
        var oy = posAttr.getY(p);
        var oz = posAttr.getZ(p);
        var n = 0.85 + Math.random() * 0.3;
        posAttr.setXYZ(p, ox * n, oy * n, oz * n);
      }
      posAttr.needsUpdate = true;
      rockGeo.computeVertexNormals();

      var rock = new THREE.Mesh(rockGeo, rockMat);
      rock.position.set(pos.x, rockSize * 0.6, pos.z);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
      decorGroup.add(rock);

      decorColliders.push({ x: pos.x, z: pos.z, r: rockSize + CONFIG.rockCollideR });
    }
  }
}

function applyTheme(theme) {
  if (skyMat.map) skyMat.map.dispose();
  skyMat.map = makeSkyGradient(theme.skyTop, theme.skyBottom);
  skyMat.needsUpdate = true;

  if (groundMat.map) groundMat.map.dispose();
  groundMat.map = makeGroundTexture(theme.ground, theme.groundDark);
  groundMat.color.setHex(0xffffff);
  groundMat.needsUpdate = true;

  scene.fog = new THREE.Fog(theme.fogColor, theme.fogNear, theme.fogFar);

  grid.material.color.setHex(theme.gridMain);
  grid.material.opacity = 0.4;

  hemiLight.color.setHex(theme.hemiSky);
  hemiLight.groundColor.setHex(theme.hemiGround);
  hemiLight.intensity = theme.hemiInt;

  sun.color.setHex(theme.sunColor);
  sun.intensity = theme.sunInt;
  sun.position.set(theme.sunPos[0], theme.sunPos[1], theme.sunPos[2]);

  fillLight.color.setHex(theme.fillColor);
  fillLight.intensity = theme.fillInt;
  fillLight.position.set(theme.fillPos[0], theme.fillPos[1], theme.fillPos[2]);

  buildDecor(theme);
  buildGroundDecor(theme);
  buildParticles(theme);

  cloudGroup.visible = !!theme.cloud;
  if (theme.cloud) buildClouds();

  starGroup.visible = !!theme.stars;
  if (theme.stars) buildStars();
}

var crystals = [];

function makeCrystal() {
  var group = new THREE.Group();

  var coreMat = new THREE.MeshStandardMaterial({
    color: CONFIG.crystalColor,
    emissive: CONFIG.crystalEmissive,
    emissiveIntensity: 0.9,
    flatShading: true,
    transparent: true
  });
  var core = new THREE.Mesh(new THREE.OctahedronGeometry(0.62, 0), coreMat);
  core.castShadow = true;
  group.add(core);

  var haloMat = new THREE.MeshBasicMaterial({
    color: CONFIG.crystalColor, wireframe: true,
    transparent: true, opacity: 0.4
  });
  var halo = new THREE.Mesh(new THREE.OctahedronGeometry(0.9, 0), haloMat);
  group.add(halo);

  return {
    group: group, core: core, halo: halo,
    coreMat: coreMat, haloMat: haloMat,
    phase: Math.random() * Math.PI * 2,
    state: 'idle', timer: 0
  };
}

for (var ci = 0; ci < CONFIG.crystalCount; ci++) {
  var c = makeCrystal();
  scene.add(c.group);
  crystals.push(c);
}

function resetCrystals() {
  var placed = [];
  crystals.forEach(function (c) {
    var p = null;
    for (var attempt = 0; attempt < 60; attempt++) {
      var cand = randomPos(5.5, placed);
      if (Math.hypot(cand.x, cand.z) < 3.0) continue;
      var ok = true;
      for (var k = 0; k < decorColliders.length; k++) {
        var d = decorColliders[k];
        if (Math.hypot(d.x - cand.x, d.z - cand.z) < d.r + 1.2) { ok = false; break; }
      }
      if (!ok) continue;
      p = cand;
      break;
    }
    if (!p) p = randomPos(5.5, placed);
    placed.push(p);

    c.group.position.set(p.x, 0.9, p.z);
    c.group.scale.setScalar(1);
    c.group.visible = true;
    c.group.rotation.set(0, Math.random() * Math.PI, 0);

    c.coreMat.opacity = 1;
    c.coreMat.emissiveIntensity = 0.9;
    c.haloMat.opacity = 0.4;

    c.state = 'idle';
    c.timer = 0;
  });
}

var ghosts = [];

function makeGhost() {
  var group = new THREE.Group();

  var bodyMat = new THREE.MeshStandardMaterial({
    color: CONFIG.ghostColor, flatShading: true, roughness: 0.45
  });
  var body = new THREE.Mesh(new THREE.SphereGeometry(0.72, 8, 6), bodyMat);
  body.scale.set(1, 1.15, 1);

  [-1, 1].forEach(function (sx) {
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), eyeMat);
    eye.position.set(0.27 * sx, 1.14, 0.58);
    group.add(eye);
  });

  var spikeMat = new THREE.MeshStandardMaterial({
    color: 0x9b86c9, flatShading: true, roughness: 0.6
  });
  for (var i = 0; i < 5; i++) {
    var a = (i / 5) * Math.PI * 2;
    var spike = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 4), spikeMat);
    spike.position.set(Math.cos(a) * 0.46, 0.45, Math.sin(a) * 0.46);
    spike.rotation.x = Math.PI;
    group.add(spike);
  }

  return { group: group, body: body, bodyMat: bodyMat,
           phase: Math.random() * Math.PI * 2 };
}

function addGhost() {
  var g = makeGhost();
  scene.add(g.group);
  ghosts.push(g);
  return g;
}

function clearGhosts() {
  ghosts.forEach(function (g) { scene.remove(g.group); });
  ghosts.length = 0;
}

function teleportGhostAway(ghost, minDist) {
  minDist = minDist || 18;
  var p, tries = 0;
  do {
    p = randomPos(0, []);
    tries++;
  } while (
    Math.hypot(p.x - player.position.x, p.z - player.position.z) < minDist &&
    tries < 120
  );
  ghost.group.position.set(p.x, 0, p.z);
}

function resetGhosts() {
  ghosts.forEach(function (g) { teleportGhostAway(g, 18); });
}

var state = {
  running: false, score: 0, lives: CONFIG.maxLives,
  invincible: 0, time: 0, level: 1,
  ghostBaseSpeed: CONFIG.ghostSpeed,
  switching: false, waitingChoice: false,
  dashTimer: 0, dashCooldown: 0, dashDir: { x: 0, z: 1 },
  dodgeTimer: 0, dodgeCooldown: 0
};

function updateHUD() {
  scoreEl.textContent = state.score;
  var full = Math.max(state.lives, 0);
  var empty = Math.max(CONFIG.maxLives - state.lives, 0);
  livesEl.textContent = '❤'.repeat(full) + '♡'.repeat(empty);
  levelEl.textContent = state.level;
}

function ghostCountForLevel(lv) {
  return Math.min(CONFIG.ghostCountBase + (lv - 1), CONFIG.ghostCountMax);
}
function ghostSpeedForLevel(lv) {
  return Math.min(CONFIG.ghostSpeed + (lv - 1) * CONFIG.ghostSpeedPerLv,
                  CONFIG.ghostSpeedMax);
}

/* =========================================================
   ⑲ 关卡
   ========================================================= */
function startLevel(lv) {
  state.level = lv;
  state.ghostBaseSpeed = ghostSpeedForLevel(lv);
  state.switching = false;
  state.waitingChoice = false;

  var theme = themeForLevel(lv);
  applyTheme(theme);

  resetCrystals();

  clearGhosts();
  var n = ghostCountForLevel(lv);
  for (var i = 0; i < n; i++) addGhost();
  resetGhosts();

  updateHUD();

  toastEl.innerHTML = '第 ' + lv + ' 关<span class="sub2">' + theme.name + '</span>';
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
}

function onLevelClear() {
  state.waitingChoice = true;
  clearScoreEl.textContent = state.score;
  clearLevelEl.textContent = state.level;

  var cyclePos = ((state.level - 1) % 4) + 1;
  var progress = (cyclePos / 4) * 100;
  levelProgressEl.style.width = progress + '%';

  var nextTheme = themeForLevel(state.level + 1);
  nextEnvTipEl.textContent = nextTheme.name;
  nextEnvIconEl.textContent = nextTheme.icon;

  levelClearEl.classList.remove('hidden');
}

function goToNextLevel() {
  levelClearEl.classList.add('hidden');
  startLevel(state.level + 1);
}

function stayHere() {
  state.waitingChoice = false;
  state.switching = false;
  levelClearEl.classList.add('hidden');
  resetCrystals();
  resetGhosts();
}

nextBtn.addEventListener('click', goToNextLevel);
stayBtn.addEventListener('click', stayHere);

   ========================================================= */
var keys = {};
var BLOCK = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1, Space:1 };

window.addEventListener('keydown', function (e) {
  if (BLOCK[e.code]) e.preventDefault();

  if (state.waitingChoice) {
    if (e.code === 'Enter')  { goToNextLevel(); return; }
    if (e.code === 'Escape') { stayHere();      return; }
  }

  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'Space')
      && state.running && state.dashCooldown <= 0 && state.dashTimer <= 0) {
    triggerDash();
  }
  if (e.code === 'KeyE' && state.running && state.dodgeCooldown <= 0 && state.dodgeTimer <= 0) {
    triggerDodge();
  }

  keys[e.code] = true;
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { keys = {}; });

/* =========================================================
   ㉑ 技能
   ========================================================= */
function triggerDash() {
  state.dashTimer = CONFIG.dashTime;
  state.dashCooldown = CONFIG.dashCooldown;

  var dx = 0, dz = 0;
  if (keys.KeyW || keys.ArrowUp)    dz -= 1;
  if (keys.KeyS || keys.ArrowDown)  dz += 1;
  if (keys.KeyA || keys.ArrowLeft)  dx -= 1;
  if (keys.KeyD || keys.ArrowRight) dx += 1;

  if (dx !== 0 || dz !== 0) {
    var len = Math.hypot(dx, dz);
    dx /= len; dz /= len;
  } else {
    dx = Math.sin(player.rotation.y);
    dz = Math.cos(player.rotation.y);
  }
  state.dashDir.x = dx;
  state.dashDir.z = dz;
  sfxDash();
}

function triggerDodge() {
  state.dodgeTimer = CONFIG.dodgeTime;
  state.dodgeCooldown = CONFIG.dodgeCooldown;
  state.invincible = Math.max(state.invincible, CONFIG.dodgeTime + 0.2);

  ghosts.forEach(function (g) {
    var gp = g.group.position;
    var dx = gp.x - player.position.x;
    var dz = gp.z - player.position.z;
    var d = Math.hypot(dx, dz);
    if (d < CONFIG.dodgeRadius && d > 0.001) {
      var push = (CONFIG.dodgeRadius - d) * 1.5;
      gp.x += (dx / d) * push;
      gp.z += (dz / d) * push;
    }
  });

  var ringGeo = new THREE.RingGeometry(0.5, 1.0, 32);
  var ringMat = new THREE.MeshBasicMaterial({
    color: 0x9ffff5, transparent: true, opacity: 0.9, side: THREE.DoubleSide
  });
  var ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.copy(player.position);
  ring.position.y = 0.2;
  scene.add(ring);

  var t = 0;
  var interval = setInterval(function () {
    t += 1 / 60;
    if (t >= 0.5) {
      clearInterval(interval);
      scene.remove(ring);
      ringMat.dispose();
      ringGeo.dispose();
      return;
    }
    var s = 1 + t * CONFIG.dodgeRadius * 1.5;
    ring.scale.setScalar(s);
    ringMat.opacity = 0.9 * (1 - t / 0.5);
  }, 16);

  sfxDodge();
}

/* =========================================================
   ㉒ 玩家移动 + 视觉更新
   ========================================================= */
function resolveDecorCollision(nx, nz) {
  var pr = CONFIG.playerRadius + CONFIG.decorGap;
  for (var k = 0; k < decorColliders.length; k++) {
    var d = decorColliders[k];
    var dx = nx - d.x;
    var dz = nz - d.z;
    var dist = Math.hypot(dx, dz);
    var minDist = pr + d.r;
    if (dist < minDist) {
      if (dist < 0.0001) {
        var ang = Math.random() * Math.PI * 2;
        dx = Math.cos(ang); dz = Math.sin(ang); dist = 1;
      }
      nx = d.x + (dx / dist) * minDist;
      nz = d.z + (dz / dist) * minDist;
    }
  }
  nx = clamp(nx, -LIMIT, LIMIT);
  nz = clamp(nz, -LIMIT, LIMIT);
  return { x: nx, z: nz };
}

function updatePlayer(dt) {
  if (state.dashCooldown > 0) state.dashCooldown -= dt;
  if (state.dodgeCooldown > 0) state.dodgeCooldown -= dt;

  if (state.dashTimer > 0) {
    state.dashTimer -= dt;
    var nx = player.position.x + state.dashDir.x * CONFIG.dashSpeed * dt;
    var nz = player.position.z + state.dashDir.z * CONFIG.dashSpeed * dt;
    nx = clamp(nx, -LIMIT, LIMIT);
    nz = clamp(nz, -LIMIT, LIMIT);
    var fixed = resolveDecorCollision(nx, nz);
    player.position.x = fixed.x;
    player.position.z = fixed.z;
  } else {
    var dx = 0, dz = 0;
    if (keys.KeyW || keys.ArrowUp)    dz -= 1;
    if (keys.KeyS || keys.ArrowDown)  dz += 1;
    if (keys.KeyA || keys.ArrowLeft)  dx -= 1;
    if (keys.KeyD || keys.ArrowRight) dx += 1;

    var len = Math.hypot(dx, dz);
    if (len > 0) {
      dx /= len; dz /= len;
      var nx2 = player.position.x + dx * CONFIG.playerSpeed * dt;
      var nz2 = player.position.z + dz * CONFIG.playerSpeed * dt;
      nx2 = clamp(nx2, -LIMIT, LIMIT);
      nz2 = clamp(nz2, -LIMIT, LIMIT);
      var fixed2 = resolveDecorCollision(nx2, nz2);
      player.position.x = fixed2.x;
      player.position.z = fixed2.z;
      var targetRot = Math.atan2(dx, dz);
      player.rotation.y = lerpAngle(player.rotation.y, targetRot,
        1 - Math.exp(-14 * dt));
    }
  }

  if (state.dodgeTimer > 0) {
    state.dodgeTimer -= dt;
    if (state.dodgeTimer <= 0) state.dodgeTimer = 0;
  }

  /* ===== 玩家动画 ===== */
  /* 身体上下浮动 */
  var bob = Math.sin(state.time * 3) * 0.05;
  playerParts.body.position.y = 1.05 + bob;

  /* 呼吸 */
  var breath = 1 + Math.sin(state.time * 2.5) * 0.015;
  playerParts.body.scale.set(breath, 1.02 * breath, breath);

  /* 底座轻微上下浮动（反相） */
  playerParts.base.position.y = 0.45 - bob * 0.4;
  playerParts.base.scale.set(1, 0.6 + Math.sin(state.time * 3) * 0.03, 1);

  /* 角浮动 */
  playerParts.horn.position.y = 1.78 + bob;

  /* 蝴蝶结轻微旋转 */
  playerParts.bow.rotation.z = Math.sin(state.time * 2) * 0.15;
  playerParts.bow.rotation.x = -0.2 + Math.sin(state.time * 3) * 0.1;

  /* 垂直魔法光环旋转 */
  playerParts.halo.rotation.z = state.time * 1.2;
  playerParts.halo.rotation.x = Math.PI * 0.15 + Math.sin(state.time * 1.5) * 0.2;

  /* 4 颗环绕金星 */
  playerParts.stars.forEach(function (star, i) {
    var a = star.userData.angle + state.time * 1.3;
    star.position.set(
      Math.cos(a) * 1.2,
      1.05 + Math.sin(state.time * 2.5 + i) * 0.2,
      Math.sin(a) * 1.2
    );
    star.rotation.x = state.time * 2 + i;
    star.rotation.y = state.time * 1.5 + i;
  });

  /* 脚底光圈呼吸 */
  playerParts.glow.material.opacity = 0.22 + Math.sin(state.time * 2) * 0.08;
  playerParts.glow.scale.setScalar(1 + Math.sin(state.time * 2) * 0.06);

  /* 眨眼 */
  playerParts.blinkTimer += dt;
  if (playerParts.blinkTimer > playerParts.blinkCooldown) {
    var blinkT = (playerParts.blinkTimer - playerParts.blinkCooldown) / 0.15;
    if (blinkT < 1) {
      var sy = 1 - Math.sin(blinkT * Math.PI) * 0.9;
      playerParts.eyes.forEach(function (eye) {
        eye.scale.set(1, 1.1 * sy, 0.6);
      });
      playerParts.eyeShines.forEach(function (s) {
        s.material.opacity = sy;
      });
    } else {
      playerParts.eyes.forEach(function (eye) {
        eye.scale.set(1, 1.1, 0.6);
      });
      playerParts.eyeShines.forEach(function (s) {
        s.material.opacity = 1;
      });
      playerParts.blinkTimer = 0;
      playerParts.blinkCooldown = 2 + Math.random() * 4;
    }
  }
}

/* =========================================================
   ㉓ 幽灵追踪
   ========================================================= */
var GHOST_COLOR = new THREE.Color(CONFIG.ghostColor);
var GHOST_ALERT = new THREE.Color(0xff8fb0);

function updateGhosts(dt) {
  ghosts.forEach(function (g) {
    var gp = g.group.position;

    var dx = player.position.x - gp.x;
    var dz = player.position.z - gp.z;
    var dist = Math.hypot(dx, dz) || 1;
    var vx = dx / dist;
    var vz = dz / dist;

    ghosts.forEach(function (other) {
      if (other === g) return;
      var ox = gp.x - other.group.position.x;
      var oz = gp.z - other.group.position.z;
      var od = Math.hypot(ox, oz);
      if (od < 2.6 && od > 0.001) {
        var push = (2.6 - od) * 0.9;
        vx += (ox / od) * push;
        vz += (oz / od) * push;
      }
    });

    var wobble = Math.sin(state.time * 2.4 + g.phase) * 0.35;
    var nvx = vx - vz * wobble;
    var nvz = vz + vx * wobble;
    vx = nvx; vz = nvz;

    var t = 1 - clamp(dist / CONFIG.chaseRange, 0, 1);
    var boost = 1 + (CONFIG.chaseBoost - 1) * t;
    var speed = state.ghostBaseSpeed * boost;

    var vlen = Math.hypot(vx, vz) || 1;
    gp.x += (vx / vlen) * speed * dt;
    gp.z += (vz / vlen) * speed * dt;

    g.group.rotation.y = Math.atan2(dx, dz);
    g.body.position.y = 1.0 + Math.sin(state.time * 3 + g.phase) * 0.12;

    var s = 1 + t * 0.18;
    g.group.scale.setScalar(s);
    var targetColor = t > 0.5 ? GHOST_ALERT : GHOST_COLOR;
    g.bodyMat.color.lerp(targetColor, 1 - Math.exp(-8 * dt));

    if (state.dodgeTimer > 0) {
      var dodgeDist = Math.hypot(
        gp.x - player.position.x,
        gp.z - player.position.z
      );
      if (dodgeDist < CONFIG.dodgeRadius) {
        gp.x += (dx / (dist || 1)) * 6 * dt;
        gp.z += (dz / (dist || 1)) * 6 * dt;
      }
    }
  });
}

/* =========================================================
   ㉔ 水晶判定
   ========================================================= */
function checkCrystals() {
  crystals.forEach(function (c) {
    if (c.state !== 'idle') return;
    var d = Math.hypot(
      c.group.position.x - player.position.x,
      c.group.position.z - player.position.z
    );
    if (d < CONFIG.crystalRadius) {
      c.state = 'dying';
      c.timer = 0;
      state.score += 1;
      updateHUD();
      sfxCollect();
    }
  });

  if (!state.switching && !state.waitingChoice) {
    var allGone = crystals.every(function (c) { return c.state === 'gone'; });
    if (allGone) onLevelClear();
  }
}

function updateCrystalVisuals(dt) {
  crystals.forEach(function (c) {
    if (c.state === 'gone') return;
    if (c.state === 'idle') {
      c.group.rotation.y += dt * 1.3;
      c.group.position.y = 0.9 + Math.sin(state.time * 2 + c.phase) * 0.22;
      c.halo.rotation.y -= dt * 0.9;
      c.halo.rotation.x += dt * 0.6;
    } else if (c.state === 'dying') {
      c.timer += dt / 0.5;
      var t = Math.min(c.timer, 1);
      c.group.rotation.y += dt * 10;
      c.group.scale.setScalar(1 + t * 1.6);
      c.group.position.y = 0.9 + t * 1.4;
      c.coreMat.opacity = 1 - t;
      c.haloMat.opacity = 0.4 * (1 - t);
      c.coreMat.emissiveIntensity = 0.9 + t * 4;
      if (t >= 1) {
        c.state = 'gone';
        c.group.visible = false;
      }
    }
  });
}

/* =========================================================
   ㉕ 幽灵碰撞
   ========================================================= */
function checkGhostCollision() {
  if (state.invincible > 0) return;
  if (state.waitingChoice) return;
  if (state.dodgeTimer > 0) return;

  for (var i = 0; i < ghosts.length; i++) {
    var g = ghosts[i];
    var d = Math.hypot(
      g.group.position.x - player.position.x,
      g.group.position.z - player.position.z
    );
    if (d < CONFIG.playerRadius + CONFIG.ghostRadius) {
      hurtPlayer(g);
      break;
    }
  }
}

function hurtPlayer(ghost) {
  state.lives -= 1;
  state.invincible = CONFIG.invincibleTime;
  updateHUD();
  teleportGhostAway(ghost, 20);

  flashEl.classList.remove('hit');
  void flashEl.offsetWidth;
  flashEl.classList.add('hit');
  sfxHurt();

  if (state.lives <= 0) gameOver();
}

/* =========================================================
   ㉖ 结束 / 重开 / 回主页
   ========================================================= */
function gameOver() {
  state.running = false;
  state.invincible = 0;
  player.visible = true;
  finalScoreEl.textContent = state.score;
  finalLevelEl.textContent = state.level;
  overlay.classList.remove('hidden');
}

function restartGame() {
  state.running = true;
  state.score = 0;
  state.lives = CONFIG.maxLives;
  state.invincible = 0;
  state.time = 0;
  state.switching = false;
  state.waitingChoice = false;
  state.dashTimer = 0;
  state.dashCooldown = 0;
  state.dodgeTimer = 0;
  state.dodgeCooldown = 0;

  player.position.set(0, 0, 0);
  player.rotation.y = 0;
  player.visible = true;

  camera.position.set(0, CONFIG.cameraHeight, CONFIG.cameraBack);
  camera.lookAt(0, 1.2, 0);

  overlay.classList.add('hidden');
  levelClearEl.classList.add('hidden');

  startLevel(1);
}

restartBtn.addEventListener('click', restartGame);

function backToHome() {
  state.running = false;
  state.waitingChoice = false;
  overlay.classList.add('hidden');
  levelClearEl.classList.add('hidden');
  homeEl.classList.remove('hidden');
  hudEl.style.display = 'none';
  hintEl.style.display = 'none';
  skillsEl.style.display = 'none';
}
backHomeBtn.addEventListener('click', backToHome);

/* =========================================================
   ㉗ 相机
   ========================================================= */
function updateCamera(dt) {
  var k = 1 - Math.exp(-CONFIG.cameraSmooth * dt);
  camera.position.x += (player.position.x - camera.position.x) * k;
  camera.position.z += (player.position.z + CONFIG.cameraBack - camera.position.z) * k;
  camera.position.y = CONFIG.cameraHeight;
  camera.lookAt(player.position.x, 1.2, player.position.z);
}

function updateClouds(dt) {
  if (!cloudGroup.visible) return;
  cloudGroup.children.forEach(function (c) {
    c.userData.orbit += c.userData.speed * dt;
    c.position.x = Math.cos(c.userData.orbit) * c.userData.radius;
    c.position.z = Math.sin(c.userData.orbit) * c.userData.radius;
  });
}

/* =========================================================
   ㉘ 技能 UI
   ========================================================= */
function updateSkillUI() {
  var dashRatio = state.dashCooldown / CONFIG.dashCooldown;
  dashCdEl.style.height = (dashRatio * 100) + '%';
  if (state.dashCooldown <= 0) skillDashEl.classList.add('ready');
  else skillDashEl.classList.remove('ready');

  var dodgeRatio = state.dodgeCooldown / CONFIG.dodgeCooldown;
  dodgeCdEl.style.height = (dodgeRatio * 100) + '%';
  if (state.dodgeCooldown <= 0) skillDodgeEl.classList.add('ready');
  else skillDodgeEl.classList.remove('ready');
}

/* =========================================================
   ㉙ 主循环
   ========================================================= */
var lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (!state.running) {
    renderer.render(scene, camera);
    return;
  }

  state.time += dt;
  skySphere.position.copy(camera.position);

  if (!state.waitingChoice) {
    updatePlayer(dt);
    updateGhosts(dt);
    checkCrystals();
    checkGhostCollision();

    if (state.invincible > 0) {
      state.invincible -= dt;
      player.visible = Math.floor(state.time * 14) % 2 === 0;
      if (state.invincible <= 0) {
        state.invincible = 0;
        player.visible = true;
      }
    }
  }

  updateParticles(dt);
  updateClouds(dt);
  updateCrystalVisuals(dt);
  updateCamera(dt);
  updateSkillUI();
  renderer.render(scene, camera);
}

/* =========================================================
   ㉚ 自适应
   ========================================================= */
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   ㉛ 开始
   ========================================================= */
startBtn.addEventListener('click', function () {
  ensureAudio();
  homeEl.classList.add('hidden');
  hudEl.style.display = 'flex';
  hintEl.style.display = 'block';
  skillsEl.style.display = 'flex';

  lastTime = performance.now();
  requestAnimationFrame(animate);

  restartGame();
});

applyTheme(THEMES[0]);
skySphere.position.copy(camera.position);
renderer.render(scene, camera);
</script>
</body>
